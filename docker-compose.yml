services:
  auth_service:
    build: ./auth_service
    container_name: llm_auth_service
    env_file:
      - ./auth_service/.env
    ports:
      - "8000:8000"
    volumes:
      - auth_sqlite_data:/app/data
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  bot_api:
    build: ./bot_service
    container_name: llm_bot_api
    env_file:
      - ./bot_service/.env
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - rabbitmq
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]

  bot_polling:
    build: ./bot_service
    container_name: llm_bot_polling
    env_file:
      - ./bot_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["uv", "run", "python", "-m", "app.bot.dispatcher"]

  bot_worker:
    build: ./bot_service
    container_name: llm_bot_worker
    env_file:
      - ./bot_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["uv", "run", "celery", "-A", "app.infra.celery_app:celery_app", "worker", "--loglevel=info"]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: llm_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: llm_redis
    ports:
      - "6379:6379"

volumes:
  auth_sqlite_data:
